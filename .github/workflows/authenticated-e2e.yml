name: Protected authenticated E2E

on:
  repository_dispatch:
    types:
      - rotrack-authenticated-e2e

permissions:
  contents: read

concurrency:
  group: protected-authenticated-e2e
  cancel-in-progress: false

jobs:
  authenticated-e2e-protected:
    name: Authenticated E2E (protected non-production)
    if: ${{ vars.ROTRACK_AUTHENTICATED_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Solo-maintainer policy keeps this job disabled and environment secrets
    # empty. A future hosted credentialed run requires a second trusted reviewer
    # and independently verified environment protection before enablement.
    environment: nonproduction
    steps:
      - name: Require explicit non-production payload confirmation
        env:
          CONFIRMED: ${{ github.event.client_payload.confirm_nonproduction }}
        run: |
          if [[ "$CONFIRMED" != "nonproduction-authenticated-e2e-only" ]]; then
            echo "Refusing to run without explicit non-production confirmation in client_payload." >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run required authenticated suite and destroy sensitive output
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.ROTRACK_E2E_BASE_URL }}
          API_URL: ${{ secrets.ROTRACK_E2E_EXPECTED_API_URL }}
          APPROVED_FRONTEND_HOST: ${{ vars.ROTRACK_E2E_APPROVED_FRONTEND_HOST }}
          APPROVED_API_HOST: ${{ vars.ROTRACK_E2E_APPROVED_API_HOST }}
          NONPRODUCTION_SUPABASE_REF: ${{ secrets.ROTRACK_NONPRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_REF: ${{ secrets.ROTRACK_PRODUCTION_SUPABASE_PROJECT_REF }}
          USER_A_STATE: ${{ secrets.ROTRACK_E2E_USER_A_STORAGE_STATE_JSON }}
          USER_B_STATE: ${{ secrets.ROTRACK_E2E_USER_B_STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          : "${BASE_URL:?Protected environment must provide ROTRACK_E2E_BASE_URL}"
          : "${API_URL:?Protected environment must provide ROTRACK_E2E_EXPECTED_API_URL}"
          : "${APPROVED_FRONTEND_HOST:?Protected environment must provide ROTRACK_E2E_APPROVED_FRONTEND_HOST}"
          : "${APPROVED_API_HOST:?Protected environment must provide ROTRACK_E2E_APPROVED_API_HOST}"
          : "${NONPRODUCTION_SUPABASE_REF:?Protected environment must provide non-production Supabase identity}"
          : "${PRODUCTION_SUPABASE_REF:?Protected environment must provide production Supabase identity}"
          : "${USER_A_STATE:?Protected environment must provide User A storage state}"
          : "${USER_B_STATE:?Protected environment must provide User B storage state}"

          # These identities are checked before any browser starts. A preview/API
          # mix-up or a production overlap must stop rather than become test data.
          NONPRODUCTION_ORIGIN="$(node <<'NODE'
          const values = {
            frontend: process.env.BASE_URL,
            api: process.env.API_URL,
            approvedFrontend: process.env.APPROVED_FRONTEND_HOST,
            approvedApi: process.env.APPROVED_API_HOST,
          };
          const hostnamePattern = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/;

          function approvedHost(raw, suffix) {
            if (
              raw !== raw.toLowerCase() ||
              !hostnamePattern.test(raw) ||
              !raw.endsWith(suffix) ||
              raw === suffix.slice(1)
            ) {
              throw new Error("invalid approved host identity");
            }
            return raw;
          }

          function normalized(raw, suffix, api) {
            const url = new URL(raw);
            const host = url.hostname.toLowerCase();
            if (
              url.protocol !== "https:" ||
              url.username ||
              url.password ||
              url.port ||
              url.search ||
              url.hash ||
              !host ||
              !hostnamePattern.test(host) ||
              !host.endsWith(suffix) ||
              host === suffix.slice(1)
            ) {
              throw new Error("invalid protected URL identity");
            }
            const path = url.pathname.replace(/\/$/, "") || "/";
            if ((api && path !== "/api/v1") || (!api && path !== "/")) {
              throw new Error("invalid protected URL path");
            }
            return { origin: url.origin, host };
          }

          try {
            const frontend = normalized(values.frontend, ".vercel.app", false);
            const api = normalized(values.api, ".azurecontainerapps.io", true);
            const approvedFrontend = approvedHost(values.approvedFrontend, ".vercel.app");
            const approvedApi = approvedHost(values.approvedApi, ".azurecontainerapps.io");
            if (
              frontend.host !== approvedFrontend ||
              api.host !== approvedApi ||
              frontend.host === api.host
            ) {
              throw new Error("protected identities do not match approved readback");
            }
            console.log(frontend.origin);
          } catch {
            console.error("Protected non-production URL identities are invalid.");
            process.exit(1);
          }
          NODE
          )"

          if [[ ! "$NONPRODUCTION_SUPABASE_REF" =~ ^[a-z0-9]{20}$ ]] || \
             [[ ! "$PRODUCTION_SUPABASE_REF" =~ ^[a-z0-9]{20}$ ]] || \
             [[ "$NONPRODUCTION_SUPABASE_REF" == "$PRODUCTION_SUPABASE_REF" ]]; then
            echo "Protected authenticated E2E requires two distinct Supabase project identities." >&2
            exit 1
          fi

          # Playwright requires files, but they live only in the mode-restricted
          # runner temp directory. They are never checked in, cached, or uploaded.
          umask 077
          state_dir=$(mktemp -d "${RUNNER_TEMP}/rotrack-auth-state.XXXXXX")
          chmod 700 "$state_dir"
          cleanup() {
            rm -rf -- "$state_dir" test-results playwright-report
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          printf '%s' "$USER_A_STATE" > "$state_dir/user-a.json"
          printf '%s' "$USER_B_STATE" > "$state_dir/user-b.json"
          # Parse only the allowlisted Supabase session value. The jq result is
          # discarded, so neither bearer token nor extracted user identity can
          # enter command arguments, logs, or workflow output.
          jq -e -s \
            --arg expected_origin "$NONPRODUCTION_ORIGIN" \
            --arg expected_token "sb-${NONPRODUCTION_SUPABASE_REF}-auth-token" \
            --arg forbidden_token "sb-${PRODUCTION_SUPABASE_REF}-auth-token" \
            '
            def require($ok; $message):
              if $ok then . else error($message) end;
            def session:
              require((.cookies | type == "array" and length == 0); "invalid cookies")
              | require((.origins | type == "array" and length == 1); "invalid origins")
              | require((.origins[0].origin == $expected_origin); "unexpected origin")
              | require((.origins[0].localStorage | type == "array" and length == 1); "invalid localStorage")
              | require((.origins[0].localStorage[0].name == $expected_token); "unexpected auth key")
              | require((.origins[0].localStorage[0].name != $forbidden_token); "production auth key")
              | .origins[0].localStorage[0].value
              | if type == "string" then . else error("session value is not a string") end
              | try fromjson catch error("session value is not valid JSON")
              | require((type == "object"); "session value is not an object")
              | require((.access_token | type == "string" and length > 0); "session access token is empty")
              | require((.user | type == "object"); "session user is missing")
              | require((.user.id | type == "string" and length > 0); "session user id is empty")
              | { user_id: .user.id, access_token: .access_token };
            map(session) as $states
            | require(($states | length == 2); "two storage states are required")
            | require(($states[0].user_id != $states[1].user_id); "storage states share a user")
            | require(($states[0].access_token != $states[1].access_token); "storage states share a token")
            | true
            ' "$state_dir/user-a.json" "$state_dir/user-b.json" >/dev/null

          PLAYWRIGHT_JSON_OUTPUT_FILE="$state_dir/playwright-results.json" \
          ROTRACK_E2E_BASE_URL="$BASE_URL" \
          ROTRACK_E2E_EXPECTED_API_URL="$API_URL" \
          ROTRACK_E2E_USER_A_STORAGE_STATE="$state_dir/user-a.json" \
          ROTRACK_E2E_USER_B_STORAGE_STATE="$state_dir/user-b.json" \
          ROTRACK_E2E_REQUIRE_AUTH=1 \
            npm run e2e -- --reporter=json --output="$state_dir/playwright-output"
          node ../scripts/release/check-playwright-result.mjs "$state_dir/playwright-results.json"
