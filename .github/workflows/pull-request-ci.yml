name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards-secret-scan:
    name: Guards and secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository-pinned Node for release contract checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate CI and operational safeguard contracts
        run: |
          scripts/ci/test-guards.sh
          scripts/ci/guard-sensitive-paths.sh
          scripts/ci/check-workflow-policy.sh
          scripts/ci/validate-migration-order.sh
          scripts/container/test-contract.sh
          deploy/staging/tests/validate.sh
          scripts/release/check-release-safeguards.sh
          scripts/ci/run-actionlint.sh
      - name: Scan repository history for secrets
        run: scripts/ci/run-secret-scan.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit high-severity production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Run Vitest
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        env:
          # Public, nonfunctional build placeholders keep this job credential-free.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_KEY: ci-public-placeholder
          NEXT_PUBLIC_API_URL: https://api.ci.invalid/api/v1
          NEXT_PUBLIC_SITE_URL: https://site.ci.invalid
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run clean backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package

  container-artifact:
    name: Backend container artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build credential-free image from clean source
        env:
          IMAGE_REPOSITORY: rotrack-api
          IMAGE_TAG: ${{ github.sha }}
          REQUIRE_CLEAN: "1"
        run: scripts/container/build-image.sh
      - name: Inspect non-root image and forbidden filesystem content
        env:
          IMAGE_REF: rotrack-api:${{ github.sha }}
        run: scripts/container/test-image.sh

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: rotrack_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rotrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROTRACK_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/rotrack_ci?sslmode=disable
      ROTRACK_TEST_DATABASE_USERNAME: postgres
      ROTRACK_TEST_DATABASE_PASSWORD: ""
      ROTRACK_TEST_DATABASE_ISOLATED: "true"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: rotrack_ci
      PGUSER: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prove clean-database migration apply with rollback
        working-directory: backend
        env:
          ROTRACK_TEST_DATABASE_MODE: apply
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Drotrack.postgres.integration=true
          -Dtest=PostgresMigrationIntegrationTest test
      - name: Apply ordered migrations to isolated PostgreSQL
        run: scripts/ci/apply-migrations-to-local-postgres.sh
      - name: Verify migrated catalog and Spring repository behavior
        working-directory: backend
        env:
          ROTRACK_TEST_DATABASE_MODE: verify
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Drotrack.postgres.integration=true
          -Dtest=PostgresMigrationIntegrationTest,TimeEntryRepositoryPostgresIntegrationTest test
