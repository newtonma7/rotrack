spring:
  application:
    name: rotrack-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://your-project.supabase.co/auth/v1/.well-known/jwks.json}
          issuer-uri: ${SUPABASE_ISSUER_URI:https://your-project.supabase.co/auth/v1}

server:
  port: ${PORT:8080}

rotrack:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
