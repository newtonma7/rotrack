spring:
  application:
    name: rotrack-api
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DATABASE_POOL_VALIDATION_TIMEOUT_MS:2000}
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MINIMUM_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI}
          issuer-uri: ${SUPABASE_ISSUER_URI}

server:
  port: ${PORT:8080}

rotrack:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  health:
    readiness-cache-ttl: ${READINESS_CACHE_TTL:5s}
  logging:
    enabled: ${ROTRACK_STRUCTURED_LOGGING_ENABLED:false}
    environment: ${ROTRACK_LOGGING_ENVIRONMENT:staging}
    service-version: ${ROTRACK_SERVICE_VERSION:local}
  security:
    jwt:
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    rate-limit:
      requests-per-window: ${ROTRACK_MUTATION_RATE_LIMIT_REQUESTS:30}
      window: ${ROTRACK_MUTATION_RATE_LIMIT_WINDOW:1m}
      max-keys: ${ROTRACK_MUTATION_RATE_LIMIT_MAX_KEYS:10000}
